# Audits this repo's GitHub Actions workflows for security problems and stale pins
#
# - zizmor runs from a container image pinned by sha256 digest, with a
#   read-only repo mount, no capabilities, and a token that can only read
#   repository contents. Its online audits (impostor-commit,
#   known-vulnerable-actions, ref-version-mismatch, stale-action-refs) need
#   that token to query GitHub.
# - SARIF upload happens in a separate job that runs no scanner code, so the
#   `security-events: write` token is never exposed to the scanner container.
# - Every finding, at every severity, is also written to the job log, inline
#   annotations, the job summary, and the `zizmor-report` artifact by
#   .github/scripts/lint_report.py, so reviewers see findings without opening
#   code scanning. Only high-severity findings fail the job. Findings matching
#   .github/lint-ignore.toml (read from the base branch on pull requests, and
#   from the pushed commit on push runs) are left out everywhere, including
#   code scanning.
# - The action pin check is an in-repo, standard-library-only Python script
#   that reports any `uses:` not pinned to a SHA, and any SHA pin behind the
#   action's latest release, through the same reporter; unpinned references
#   fail the job. Its `action-pins.json` artifact lists every pin with its
#   latest release. Dependabot opens the matching update PRs.
#
# To bump zizmor, resolve the new tag's multi-arch index digest from ghcr.io
# and update both the tag comment and the digest.
name: Workflow Lint

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # weekly, to surface newly disclosed action vulnerabilities and new releases
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions: {}

# superseded runs are cancelled, except on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # zizmor 1.30.1
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # whether zizmor ran, so the upload job is skipped instead of failing on a
    # missing SARIF file when it did not
    outputs:
      ran: ${{ steps.zizmor.outputs.exit-code == '0' }}
    steps:
      # depth 2 includes a pull request's base commit, for the changed-file
      # breakdown and for reading the base branch's ignore file
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pull zizmor image
        run: docker pull "$ZIZMOR_IMAGE"

      # The token is passed by name (-e GH_TOKEN) so it never appears on the
      # docker command line. --no-config stops a pull request from adding a
      # zizmor config that disables audits; inline ignore comments still apply
      # because they are visible in review, as do merged entries in
      # .github/lint-ignore.toml. The auditor persona reports every
      # finding zizmor can produce, including the pedantic stale-action-refs
      # audit and low-confidence findings; only high severity fails the job.
      - name: Run zizmor
        id: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/zizmor"
          set +e
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,size=256m -e HOME=/tmp -e GH_TOKEN \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" -w /workspace \
            "$ZIZMOR_IMAGE" --no-config --persona=auditor --format=sarif . \
            > "${RUNNER_TEMP}/zizmor/zizmor.sarif"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      # In SARIF mode zizmor exits non-zero only on internal errors, so findings
      # are gated by reading the report: high-severity findings are emitted with
      # SARIF level "error", and suppressed results are excluded.
      - name: Report zizmor findings
        env:
          ZIZMOR_EXIT: ${{ steps.zizmor.outputs.exit-code }}
        run: |
          if [ "$ZIZMOR_EXIT" != "0" ]; then
            echo "zizmor failed to run (exit code ${ZIZMOR_EXIT})"
            exit 1
          fi
          python3 .github/scripts/lint_report.py --tool zizmor --format sarif \
            --input "${RUNNER_TEMP}/zizmor/zizmor.sarif" \
            --sarif-output "${RUNNER_TEMP}/zizmor/zizmor-filtered.sarif" \
            --ignore-file .github/lint-ignore.toml \
            --output-dir "${RUNNER_TEMP}/zizmor" --fail-level error

      - name: Store zizmor report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zizmor-report
          path: ${{ runner.temp }}/zizmor/
          retention-days: 7

  upload-zizmor:
    name: Upload zizmor results
    needs: zizmor
    # fork pull requests get a read-only token, so only upload for pushes,
    # schedules, manual runs, and same-repo pull requests
    if: ${{ !cancelled() && needs.zizmor.outputs.ran == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
    steps:
      - name: Download zizmor SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zizmor-report
          path: ${{ runner.temp }}/zizmor

      # the filtered SARIF leaves out findings ignored by .github/lint-ignore.toml
      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/zizmor/zizmor-filtered.sarif
          category: zizmor

  action-pins:
    name: Action pin freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # depth 2 includes a pull request's base commit, for the changed-file
      # breakdown and for reading the base branch's ignore file
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/action-pins"
          python3 .github/scripts/check_action_pins.py \
            --json "${RUNNER_TEMP}/action-pins/action-pins.json" \
            --sarif "${RUNNER_TEMP}/action-pins/action-pins.sarif"

      # outdated pins are warnings; only unpinned references fail the job
      - name: Report action pin findings
        run: |
          python3 .github/scripts/lint_report.py --tool action-pins --format sarif \
            --input "${RUNNER_TEMP}/action-pins/action-pins.sarif" \
            --ignore-file .github/lint-ignore.toml \
            --output-dir "${RUNNER_TEMP}/action-pins" --fail-level error

      - name: Store action pin report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-pins-report
          path: ${{ runner.temp }}/action-pins/
          retention-days: 7
